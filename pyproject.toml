[build-system]
requires = ["setuptools>=69.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditratingsystem"
version = "0.1.0"
requires-python = ">=3.10"
description = "Offline credit risk modelling, calibration and validation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "RiskDataScience GmbH", email = "riskdatascience@web.de"}]
maintainers = [{name = "Dr. Dimitrios Geromichalos", email = "riskdatascience@web.de"}]
keywords = ["credit-risk", "rating", "pd", "lgd", "ead", "calibration", "validation"]
dependencies = ["numpy", "scipy", "statsmodels", "pandas>=2.1", "lifelines==0.30.0", "scikit-learn", "xgboost==2.0.3"]

[project.optional-dependencies]
dataframe = ["pandas"]
ml = ["scikit-learn"]
test = ["pytest", "hypothesis"]
build = ["build"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["creditratingsystem", "creditratingsystem.*"]
namespaces = false

